name: Deploy Tipo Supabase Function
on:
  push:
    branches:
      - main
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-supabase.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-tipo-supabase-function
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: qnnnnvlissdqdwmkgrao
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Verify access token secret is present
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "ERROR: SUPABASE_ACCESS_TOKEN secret is empty in GitHub repo settings."
            exit 1
          fi

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: ^3

      - name: Deploy Edge Function
        run: supabase functions deploy tipo-api --remote="$SUPABASE_PROJECT_REF" --yes
